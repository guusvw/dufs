---
# Builds this fork's UI as a container image so a deployment can pin it by
# digest. feat/all-improvements (every UI and server fix combined) publishes
# ghcr.io/guusvw/dufs:all-improvements, which vps-infra consumes; the other
# branches keep the rolling :mobile tag.
name: mobile-image

on:
  push:
    branches: [main, feat/mobile-layout, feat/all-improvements]
    paths:
      - 'assets/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/mobile-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: mobile-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/guusvw/dufs:${{ github.ref_name == 'feat/all-improvements' && 'all-improvements' || 'mobile' }}
          provenance: false

      - run: echo "ghcr.io/guusvw/dufs@${{ steps.build.outputs.digest }}" >>"$GITHUB_STEP_SUMMARY"
